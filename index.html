<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clever Monkey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // ─── Design tokens ────────────────────────────────────────────────────
      // Brand palette: vivid violet (primary). Neutral: slate (text/surfaces).
      // Semantic: success/warning/danger/info. Used app-wide via brand-* / ink-* etc.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50:  '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
                700: '#6d28d9',
                800: '#5b21b6',
                900: '#4c1d95',
                950: '#2e1065',
              },
              ink: {
                50:  '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#475569',
                700: '#334155',
                800: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              },
              success: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' },
              warning: { 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' },
              danger:  { 50: '#fef2f2', 100: '#fee2e2', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c' },
              info:    { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
            },
            fontFamily: {
              sans: ['Apple SD Gothic Neo', 'Noto Sans KR', 'system-ui', 'sans-serif'],
              display: ['Outfit', 'Apple SD Gothic Neo', 'Noto Sans KR', 'sans-serif'],
            },
            borderRadius: {
              xs: '0.25rem',
              sm: '0.375rem',
              md: '0.5rem',
              lg: '0.75rem',
              xl: '1rem',
              '2xl': '1.25rem',
              '3xl': '1.75rem',
            },
            boxShadow: {
              'soft':   '0 1px 2px 0 rgb(15 23 42 / 0.04), 0 1px 3px 0 rgb(15 23 42 / 0.06)',
              'card':   '0 1px 3px 0 rgb(15 23 42 / 0.05), 0 4px 12px -2px rgb(15 23 42 / 0.05)',
              'lift':   '0 4px 12px -2px rgb(15 23 42 / 0.08), 0 12px 32px -8px rgb(15 23 42 / 0.10)',
              'pop':    '0 8px 24px -4px rgb(15 23 42 / 0.12), 0 24px 48px -12px rgb(15 23 42 / 0.20)',
              'brand':  '0 8px 24px -6px rgb(124 58 237 / 0.30)',
              'inner-soft': 'inset 0 1px 2px 0 rgb(15 23 42 / 0.06)',
            },
            keyframes: {
              'slide-in-up':  { from: { transform: 'translateY(100%)', opacity: '0.9' }, to: { transform: 'translateY(0)', opacity: '1' } },
              'fade-in-up':   { from: { opacity: '0', transform: 'translateY(15px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
              'fade-in':      { from: { opacity: '0' }, to: { opacity: '1' } },
              'scale-in':     { from: { opacity: '0', transform: 'scale(0.96)' }, to: { opacity: '1', transform: 'scale(1)' } },
              'pulse-brand':  { '0%, 100%': { boxShadow: '0 0 0 0 rgb(124 58 237 / 0.5)' }, '50%': { boxShadow: '0 0 0 8px rgb(124 58 237 / 0)' } },
              'shimmer':      { '0%': { backgroundPosition: '-200% 0' }, '100%': { backgroundPosition: '200% 0' } },
            },
            animation: {
              'slide-in-up':  'slide-in-up 0.3s ease-out forwards',
              'fade-in-up':   'fade-in-up 0.4s ease-out forwards',
              'fade-in':      'fade-in 0.2s ease-out forwards',
              'scale-in':     'scale-in 0.2s ease-out forwards',
              'pulse-brand':  'pulse-brand 2s ease-in-out infinite',
              'shimmer':      'shimmer 2s linear infinite',
            },
            transitionDuration: { '250': '250ms', '400': '400ms' },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Outfit:wght@600&display=swap" rel="stylesheet">
    <!-- Replaced Font Awesome with Google Material Symbols (Rounded) and enabled variable weight -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,100..700,0,0" />
    <!-- Updated pdf.js to a newer, more stable version to fix loading issues -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^18.2.0/",
    "react": "https://aistudiocdn.com/react@^18.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^18.2.0/",
    "path": "https://aistudiocdn.com/path@^0.12.7",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.0.4",
    "vite": "https://aistudiocdn.com/vite@^7.1.10",
    "process": "https://aistudiocdn.com/process@^0.11.10"
  }
}
</script>
<style>
    html, body, #root { height: 100%; }
    body {
        font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
        overflow: hidden;
        color: #0f172a; /* ink-900 */
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
    }
    input, button, textarea, select { font-family: inherit; }
    .font-outfit, .font-display { font-family: 'Outfit', sans-serif; letter-spacing: -0.01em; }

    /* Selection */
    ::selection { background: #ede9fe; color: #5b21b6; }

    /* Focus ring: unified across interactive elements */
    :focus-visible { outline: none; }
    *:focus-visible:not([data-no-ring]) {
        box-shadow: 0 0 0 2px #fff, 0 0 0 4px rgb(124 58 237 / 0.55);
        border-radius: 0.5rem;
    }

    /* Minimal scrollbar */
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-thumb { background: rgb(148 163 184 / 0.45); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
    *::-webkit-scrollbar-thumb:hover { background: rgb(100 116 139 / 0.6); border: 2px solid transparent; background-clip: padding-box; }
    *::-webkit-scrollbar-track { background: transparent; }

    /* Animations the bundler can't see (used via classes) */
    .animate-slide-in-up { animation: slide-in-up 0.3s ease-out forwards; }
    .animate-fade-in-up  { opacity: 0; animation: fade-in-up 0.4s ease-out forwards; }
    .animate-fade-in     { animation: fade-in 0.2s ease-out forwards; }
    .animate-scale-in    { animation: scale-in 0.2s ease-out forwards; }

    .touch-panning { touch-action: pan-x pan-y; }

    /* Subtle gradient background helper */
    .bg-grid {
        background-image:
          radial-gradient(circle at 1px 1px, rgb(148 163 184 / 0.18) 1px, transparent 0);
        background-size: 24px 24px;
    }
    .bg-brand-glow {
        background:
          radial-gradient(60% 50% at 80% 0%, rgb(124 58 237 / 0.12), transparent 70%),
          radial-gradient(50% 40% at 0% 100%, rgb(99 102 241 / 0.10), transparent 70%);
    }
</style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
