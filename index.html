<style>
    html, body, #root {
        height: 100%;
    }
    body {
        font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
        overflow: hidden; /* Default to hidden for the main app layout */
    }
    /* Enforce font inheritance for form elements to ensure consistent typography */
    input, button, textarea, select {
        font-family: inherit;
    }
    .font-outfit {
        font-family: 'Outfit', sans-serif;
    }
    @keyframes slide-in-up {
        from {
            transform: translateY(100%);
            opacity: 0.9;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }
    .animate-slide-in-up {
        animation: slide-in-up 0.3s ease-out forwards;
    }
    @keyframes fade-in-up {
        from {
            opacity: 0;
            transform: translateY(15px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    .animate-fade-in-up {
        opacity: 0; /* Start hidden to prevent flash of unstyled content */
        animation: fade-in-up 0.4s ease-out forwards;
    }
    .touch-panning {
        touch-action: pan-x pan-y;
    }
</style>
